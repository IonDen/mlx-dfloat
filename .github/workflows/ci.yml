name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags/history
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev
      - run: uv run python -c "import mlx.core; print('mlx import OK')"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Metal capability probe (informational)
        continue-on-error: true
        run: uv run python scripts/ci_metal_probe.py
      - name: Test (required)
        run: uv run pytest --cov=mlx_dfloat --cov=scripts --cov-report=term-missing --cov-fail-under=85
      - name: GPU decoder self-check
        run: uv run mlx-dfloat selftest
      - name: Wheel ships the canary data
        # The self-check reads these files from the installed package, so a wheel without them
        # would refuse its GPU decoder on every machine while the checkout-based tests pass.
        run: |
          uv build --wheel --out-dir dist
          listing="$(uv run python -m zipfile -l dist/*.whl)"
          for name in qwen3_4b_layer0_4blocks.npz qwen3_4b_layer0_4blocks.json long_codes.npz; do
            echo "$listing" | grep -q "mlx_dfloat/_canary_data/$name" || { echo "wheel is missing $name"; exit 1; }
          done
  integration:
    # The mflux lane: installs the optional extra from the lock (torch and transformers come with
    # mflux, pinned there too) and runs only the tests that need it.
    runs-on: macos-15
    strategy:
      matrix:
        # The lock pins mflux 0.20.0. A second row (another mflux release) would need the unlocked
        # form instead of `uv sync --extra mflux`: `uv pip install "mflux==<version>"` after the
        # sync, then `uv run --no-sync` for the steps below.
        mflux: ["0.20.0"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --group dev --extra mflux
      - run: uv run --extra mflux --group dev python -c "import mflux, mlx.core, importlib.metadata as m; print('mflux', m.version('mflux'))"
      # No combined threshold: init.py's tests run in the default lane (its live ones skip without a token); the next two steps gate each model.py on its own.
      - name: Integration tests (mflux lane)
        env:
          # Every FLUX.1 base repository is gated on the Hub (schnell auto-approved), so the three
          # live tokenizer tests skip without a token; this is the variable huggingface_hub reads first.
          # Only this step gets it: the actions, the sync and the collection and coverage steps have
          # no use for it. The secret is a read-only Hub token; the default lane runs without one.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --extra mflux --group dev pytest -m mflux --run-network --cov=mlx_dfloat.mflux.flux1.model --cov=mlx_dfloat.mflux.flux1.init --cov=mlx_dfloat.mflux.zimage.model --cov-config=.coveragerc-integration --cov-report=term-missing -q -p no:cacheprovider -rs
      - name: model.py coverage on its own (mflux lane)
        run: uv run --extra mflux --group dev coverage report --include='*/mflux/flux1/model.py' --fail-under=80
      - name: zimage/model.py coverage on its own (mflux lane)
        run: uv run --extra mflux --group dev coverage report --include='*/mflux/zimage/model.py' --fail-under=80
      - name: The lane collected mflux tests
        run: test "$(uv run --extra mflux --group dev pytest -m mflux --co -q -p no:cacheprovider | grep -c '::')" -ge 2
  build:
    # Same action the release workflow uses, so a distribution that would fail at tag time
    # (e.g. a build-backend metadata version newer than the bundled twine) fails on the PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hynek/build-and-inspect-python-package@v3.0.1
