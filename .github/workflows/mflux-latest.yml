name: mflux latest
on:
  schedule:
    # Mondays, 06:00 UTC. GitHub disables a scheduled workflow in a public repository after 60
    # days without repository activity, so a quiet spell ends the weekly check until someone
    # re-enables it in the Actions tab; any push before then restarts the 60 days.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The job only reads the repository.
permissions:
  contents: read

jobs:
  test-mflux-latest:
    # mlx-dfloat sets no upper bound on mflux, so each new mflux release reaches users before a
    # pull request here runs against it. This job moves only mflux to its newest release over
    # the locked sync (mlx, Pillow and the rest move only when that release requires a newer
    # version) and runs the mflux tests, the source fingerprint among them, then the whole
    # suite, offline. A release that changes a measured module or breaks an adapter turns it
    # red. The printed versions show whether the new mflux pulled a newer mlx or Pillow in.
    # Every `uv run` here needs `--no-sync`: a plain `uv run` re-syncs to the lockfile and
    # silently puts the locked mflux back. No cache: each run starts from the lock.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags/history
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
      - name: Sync the locked environment with the mflux extra
        run: uv sync --locked --group dev --extra mflux
      - name: Upgrade mflux alone to its newest release
        run: uv pip install --upgrade-package mflux "mflux>=0.24"
      - name: Print the mflux, mlx and Pillow under test
        run: uv run --no-sync python -c 'import importlib.metadata as md; print(*(f"{n} {md.version(n)}" for n in ("mflux", "mlx", "pillow")), sep=", ")'
      - name: mflux tests (offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync pytest -m mflux -q -p no:cacheprovider -rs
      - name: Whole suite (offline)
        # Runs after a red mflux step too, so one run shows both the changed module and anything else that broke.
        if: ${{ !cancelled() }}
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync pytest -q -p no:cacheprovider -rs
