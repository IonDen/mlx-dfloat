[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "mlx-dfloat"
description = "Run DFloat11 losslessly compressed BF16 checkpoints on Apple Silicon with MLX and a Metal decode kernel: image generation with FLUX.1, Z-Image, FLUX.2 Klein, Qwen-Image-2.1, ERNIE-Image and Krea 2 on a 32 GB Mac, with weights about 30% smaller"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Denis Ineshin", email = "denis.ineshin@gmail.com" }]
keywords = [
  "dfloat11", "df11", "lossless-compression", "bfloat16", "huffman",
  "model-compression", "weight-compression", "mlx", "apple-silicon", "metal", "macos",
  "mflux", "flux", "flux.1", "diffusion", "image-generation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "mlx>=0.31",
  "numpy>=1.26",
  "huggingface-hub>=0.24",
]

[project.scripts]
mlx-dfloat = "mlx_dfloat.cli:main"

[project.optional-dependencies]
mflux = [
  "mflux>=0.20,<0.21; sys_platform == 'darwin'",
  "psutil>=6",
]

[project.urls]
Homepage = "https://github.com/IonDen/mlx-dfloat"
Source = "https://github.com/IonDen/mlx-dfloat"
Issues = "https://github.com/IonDen/mlx-dfloat/issues"
Changelog = "https://github.com/IonDen/mlx-dfloat/blob/main/CHANGELOG.md"
"Upstream DFloat11" = "https://github.com/LeanModels/DFloat11"

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.130",
    "dahuffman==0.4.2",
    "psutil>=6",
    "pyyaml>=6",
]
typecheck = ["mypy>=1.13"]
lint = ["ruff>=0.7"]
bench = [
  "mflux>=0.20,<0.21; sys_platform == 'darwin'",
  "pyobjc-framework-Metal>=10; sys_platform == 'darwin'",
]
dev = [
  { include-group = "test" },
  { include-group = "typecheck" },
  { include-group = "lint" },
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/mlx_dfloat/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_dfloat"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".codegraph/",
  ".hypothesis/",
  ".coverage",
  ".superpowers/",
  "docs/superpowers/",
  "docs/backlog/",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"
extend-exclude = ["src/mlx_dfloat/_version.py"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "RUF", "SIM", "C4", "PIE", "PT", "RET",
  "PTH", "TID", "TCH", "N", "D", "ANN", "PYI", "PERF", "FURB",
]
ignore = ["ANN401", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]
"tests/_upstream/*.py" = ["E741", "N806", "SIM", "PERF", "B", "RUF", "UP", "C4", "RET", "FURB", "D", "ANN"]
# _upstream_get_luts_verbatim is a literal upstream copy embedded for differential testing
# (see its docstring); these codes fire only inside it and are not among the ignored rules for
# tests/_upstream/*.py, so they are scoped narrowly to this one file instead.
"tests/test_upstream_encoder.py" = ["B007", "FURB116", "RUF100"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
# 3.12 matches the dev interpreter: numpy >= 2.5 stubs use the 3.12 `type` statement. Ruff's
# py311 target still guards our own source against 3.12-only syntax.
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]
files = ["src/mlx_dfloat"]

[[tool.mypy.overrides]]
module = ["mlx.*", "mlx_lm.*", "mflux.*", "psutil.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
xfail_strict = true
filterwarnings = [
  "error",
  'ignore::DeprecationWarning:mlx\..*',
]
markers = [
  "slow: real-weights decode (opt in with --run-slow)",
  "network: test requires network access (opt in with --run-network)",
  "metal: dispatches the Metal decode kernel (runs on Apple Silicon, skips elsewhere)",
  "mflux: needs the mflux extra (skips when mflux is not installed)",
]

[tool.coverage.run]
branch = true
source = ["mlx_dfloat", "scripts"]
parallel = true
omit = [
  "src/mlx_dfloat/_version.py",
  # Measurement glue that needs mflux, PyObjC or a GPU run; its pure logic is in scripts/_bench_common.py and
  # scripts/_flux_rig.py, which are unit-tested. The two FLUX benches (bench_flux_step, bench_control_validation)
  # are measured: their pure parts, providers and step loop are unit-tested, and only the mflux-touching
  # build / orchestration lines stay uncovered.
  "scripts/bench_decode_kernel.py",
  "scripts/encode_prompt.py",
  "scripts/regpressure.py",
  "scripts/ci_metal_probe.py",
  "scripts/flux_rig_smoke.py",
  # mflux's loader and quantizer; its pure release-order logic is tested through a fake loader in
  # tests/test_q8_rig.py, the real build by the slow test.
  "scripts/_q8_rig.py",
  # every test here is @pytest.mark.mflux; measured by the integration lane instead, see ci.yml.
  "src/mlx_dfloat/mflux/flux1/model.py",
  # the same for Z-Image's model class: every test is @pytest.mark.mflux, gated in the integration lane.
  "src/mlx_dfloat/mflux/zimage/model.py",
  # the same for FLUX.2 Klein's model class: every test is @pytest.mark.mflux, gated in the integration lane.
  "src/mlx_dfloat/mflux/flux2/model.py",
  # the same for Qwen-Image 2.1's model class: every test is @pytest.mark.mflux, gated in the integration lane.
  "src/mlx_dfloat/mflux/qwen21/model.py",
  # the same for ERNIE-Image's model class: every test is @pytest.mark.mflux, gated in the integration lane.
  "src/mlx_dfloat/mflux/ernie/model.py",
  # the same for Krea 2's model class: every test is @pytest.mark.mflux, gated in the integration lane.
  "src/mlx_dfloat/mflux/krea2/model.py",
  # Each family's base loaders (init.py) and, where its tests need mflux's own transformer class, transformer.py:
  # without mflux their tests reach only 40-60 %, so the integration lane measures and gates each at 80 % on its
  # own (ci.yml). names.py and memory.py run without mflux and stay in this gate, and so do flux1/transformer.py
  # and zimage/transformer.py, which the seam fakes cover past 90 % offline.
  "src/mlx_dfloat/mflux/flux1/init.py",
  "src/mlx_dfloat/mflux/zimage/init.py",
  "src/mlx_dfloat/mflux/flux2/init.py",
  "src/mlx_dfloat/mflux/flux2/transformer.py",
  "src/mlx_dfloat/mflux/qwen21/init.py",
  "src/mlx_dfloat/mflux/qwen21/transformer.py",
  "src/mlx_dfloat/mflux/ernie/init.py",
  "src/mlx_dfloat/mflux/ernie/transformer.py",
  "src/mlx_dfloat/mflux/krea2/init.py",
  "src/mlx_dfloat/mflux/krea2/transformer.py",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "@overload", "raise NotImplementedError"]
show_missing = true
fail_under = 85
